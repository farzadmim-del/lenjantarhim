<!DOCTYPE html>

<html class="dark" dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Advertisement Request Form</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Vazirmatn", "Tahoma", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better look in dark mode */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #101622;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b4354;
            border-radius: 3px;
        }
        /* Hide default select arrow */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<div class="sticky top-0 z-10 flex items-center justify-between bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md p-4 pb-2 border-b border-slate-200 dark:border-slate-800">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer transition-colors hover:text-primary">
<span class="material-symbols-outlined text-[24px]">chevron_right</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-2">فرم درخواست تبلیغات</h2>
<div class="size-12 shrink-0"></div> <!-- Spacer for centering -->
</div>
<!-- Form Content -->
<div class="flex flex-col flex-1 px-4 py-6 gap-6 max-w-[600px] mx-auto w-full">
<!-- Section: Business Info -->
<div class="flex flex-col gap-4">
<h3 class="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider px-1">اطلاعات کسب‌وکار</h3>
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">نام کسب‌وکار</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="نام مجموعه خود را وارد کنید" value=""/>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">نام و نام خانوادگی مسئول</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="مسئول تماس" value=""/>
</label>
<div class="flex flex-wrap gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">شماره تماس</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] pl-10 text-base font-normal leading-normal transition-all text-left dir-ltr" placeholder="0912..." type="tel" value=""/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xl">call</span>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">ایمیل</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] pl-10 text-base font-normal leading-normal transition-all text-left dir-ltr" placeholder="name@example.com" type="email" value=""/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xl">mail</span>
</div>
</label>
</div>
</div>
<!-- Divider -->
<div class="h-px bg-slate-200 dark:bg-slate-800 w-full my-2"></div>
<!-- Section: Ad Details -->
<div class="flex flex-col gap-4">
<h3 class="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider px-1">جزئیات تبلیغ</h3>
<label class="flex flex-col w-full relative">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">نوع کسب‌وکار</p>
<div class="relative">
<select class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal transition-all cursor-pointer">
<option disabled="" selected="" value="">انتخاب کنید</option>
<option value="printing">چاپ و تکثیر</option>
<option value="catering">تشریفات و کرایه ظروف</option>
<option value="eulogist">مداحی و نی‌نوازی</option>
<option value="flowers">گل‌فروشی</option>
<option value="stones">سنگ مزار</option>
<option value="charity">خیریه</option>
</select>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 dark:text-[#9da6b9] pointer-events-none">expand_more</span>
</div>
</label>
<label class="flex flex-col w-full relative">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">نوع تبلیغ درخواستی</p>
<div class="relative">
<select class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal transition-all cursor-pointer">
<option disabled="" selected="" value="">انتخاب کنید</option>
<option value="banner">بنر تمام صفحه</option>
<option value="featured">آگهی ویژه (بالای لیست)</option>
<option value="carousel">اسلایدشو (Carousel)</option>
<option value="text">لینک متنی</option>
</select>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 dark:text-[#9da6b9] pointer-events-none">expand_more</span>
</div>
</label>
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal pb-2">توضیحات بیشتر / پیام</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-[#3b4354] bg-white dark:bg-[#1c1f27] focus:border-primary min-h-[120px] placeholder:text-slate-400 dark:placeholder:text-[#9da6b9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="توضیحات تکمیلی در مورد درخواست خود را اینجا بنویسید..."></textarea>
</label>
</div>
<!-- Spacer for bottom button -->
<div class="h-20"></div>
</div>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 z-20">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20">
<span class="truncate">ارسال درخواست</span>
<span class="material-symbols-outlined mr-2 text-[20px]">send</span>
</button>
</div>
</div>
</body></html>
