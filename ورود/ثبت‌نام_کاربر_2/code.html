<form class="space-y-5" onsubmit="event.preventDefault();">

<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="identity">
                        شماره موبایل یا ایمیل
                    </label>
<div class="relative">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="form-input block w-full rounded-lg border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#101622] text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary focus:ring-primary dark:focus:border-primary pr-10 pl-3 py-3 text-right" id="identity" placeholder="مثال: 09123456789" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">
                            رمز عبور
                        </label>
</div>
<div class="relative">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="form-input block w-full rounded-lg border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#101622] text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary focus:ring-primary dark:focus:border-primary pr-10 pl-3 py-3 text-right" id="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 left-0 flex items-center pl-3 cursor-pointer text-slate-400 hover:text-primary">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
<div class="text-left mt-1">
<a class="text-xs font-medium text-primary hover:text-blue-500 transition-colors" href="#">
                            فراموشی رمز عبور؟
                        </a>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                    ورود به حساب کاربری
                </button>
<!-- Divider -->
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-[#1c1f27] text-slate-500">یا ورود با</span>
</div>
</div>

<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm bg-white dark:bg-[#2d3342] text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" type="button">
<img alt="Google Logo" class="h-5 w-5 ml-2" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkPzSeDFpndepT4wvW-0B5npke8ugadaLF2SzzOOK7SBZ7GbTX7qC19GjwtkbpCZq_euAUsseaZ0tQ_ye33O5yr59afFSzKgslFzUb3-KUXRqaAy5Vkn1GWP4YDxF2DExO8xh7Pxh1m_0WgkW_VI1DNtY0MUmYNq36eS56SOkIvOXvO3EOGR8wJoKhKGAQhqLq-u1e6itf2aYJrxR4hs-lxPiuzb0Sz7LxXK_8vyvtI157RsalPiYiJwONfyQm-erPYlVp2Kpy-04"/>

</button>

<img alt="Apple Logo" class="h-5 w-5 ml-2 dark:invert" data-alt="Apple logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDorDLr2DnjOk4Nplm64bQohYhpQv9Zz6EYO8dD0guWvQ6tlaJ4MTN_WzSJLr7ESBLsZKuIx5Iwd5Y9RpreRgWLnE99C0avnhnsVyZjvfWk5O2pJqB54sRktuwwrurlBDu1wXhDOqfQg3DFTyBRSU-sWhOWGLtB6g2UOq-qReF90I2-QdAeqWotGRy8fN2CgSQUhi3Q4Wr-06X7Ner0-LybMoWIn5U5Pa1_09Be0eUkne0vorpVw1dE246L1E5Mx2pU3Rqwz6JyqDs"/>

</button>
</div>
</form>
</div>

<div class="h-1.5 w-full bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
</div>
