<!DOCTYPE html>
<html class="dark" dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Advertisement Request Form</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2563eb","primary-hover": "#1d4ed8",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a","surface-light": "#ffffff",
                        "surface-dark": "#1e293b","border-light": "#e2e8f0",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        "display": ["Vazirmatn", "Tahoma", "sans-serif"],
                        "body": ["Vazirmatn", "Tahoma", "sans-serif"]
                    },
                    borderRadius: {
                        "xl": "0.75rem",
                        "2xl": "1rem"
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'glow': '0 0 15px rgba(37, 99, 235, 0.2)',
                    }
                },
            },
        }
    </script>
<style>.no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }select {
            background-image: none;
        }input, textarea, select {
            -webkit-appearance: none;
            appearance: none;
        }.form-input:focus, .form-select:focus, .form-textarea:focus {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
            border-color: #2563eb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 antialiased selection:bg-primary/20 selection:text-primary">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<div class="sticky top-0 z-30 flex items-center justify-between bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-3 border-b border-border-light dark:border-border-dark transition-colors">
<button class="group flex size-10 items-center justify-center rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-200 text-[24px] group-hover:text-primary transition-colors">arrow_forward</span>
</button>
<h1 class="text-slate-900 dark:text-white text-base font-bold leading-tight">درخواست تبلیغات</h1>
<div class="size-10"></div>
</div>
<main class="flex flex-col flex-1 px-5 py-6 gap-8 max-w-lg mx-auto w-full pb-36">
<div class="flex flex-col gap-2">
<h2 class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
<span class="material-symbols-outlined text-primary">campaign</span>
<span>معرفی کسب‌وکار</span>
</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                    با تکمیل فرم زیر، درخواست شما جهت نمایش آگهی در اپلیکیشن بررسی و همکاران ما با شما تماس خواهند گرفت.
                </p>
</div>
<div class="flex flex-col gap-5">
<div class="flex items-center gap-2 pb-1 border-b border-dashed border-slate-200 dark:border-slate-800">
<span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">اطلاعات تماس</span>
</div>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">نام کسب‌وکار</span>
<div class="relative">
<input class="form-input w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 h-14 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-all shadow-sm focus:border-primary" placeholder="مثال: چاپخانه وحدت" type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[20px]">store</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-500 mt-1.5 pr-1">نامی که در عنوان آگهی نمایش داده می‌شود.</p>
</label>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">نام مسئول هماهنگی</span>
<input class="form-input w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark px-4 h-14 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-all shadow-sm focus:border-primary" placeholder="نام و نام خانوادگی" type="text"/>
</label>
<div class="grid grid-cols-1 gap-5">
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">شماره موبایل</span>
<div class="relative">
<input class="form-input w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-12 pr-4 h-14 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-all shadow-sm focus:border-primary text-left dir-ltr font-sans" placeholder="0912..." type="tel"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[22px]">smartphone</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-500 mt-1.5 pr-1">جهت ارسال پیامک وضعیت تایید آگهی.</p>
</label>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">ایمیل (اختیاری)</span>
<div class="relative">
<input class="form-input w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-12 pr-4 h-14 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-all shadow-sm focus:border-primary text-left dir-ltr font-sans" placeholder="example@gmail.com" type="email"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[22px]">mail</span>
</div>
</label>
</div>
</div>
<div class="flex flex-col gap-5">
<div class="flex items-center gap-2 pb-1 border-b border-dashed border-slate-200 dark:border-slate-800 pt-2">
<span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">جزئیات تبلیغ</span>
</div>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">زمینه فعالیت</span>
<div class="relative">
<select class="form-select w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-10 pr-4 h-14 text-slate-900 dark:text-white focus:border-primary transition-all shadow-sm cursor-pointer">
<option disabled="" selected="" value="">انتخاب کنید...</option>
<option value="printing">چاپ و تکثیر (اعلامیه)</option>
<option value="catering">کرایه ظروف و میز</option>
<option value="eulogist">مداحی و نی‌نوازی</option>
<option value="flowers">تاج گل و گل‌آرایی</option>
<option value="stones">سنگ مزار</option>
<option value="ambulance">آمبولانس و حمل متوفی</option>
<option value="charity">موسسات خیریه</option>
<option value="other">سایر موارد</option>
</select>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">expand_more</span>
</div>
</label>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">نوع پکیج درخواستی</span>
<div class="relative">
<select class="form-select w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-10 pr-4 h-14 text-slate-900 dark:text-white focus:border-primary transition-all shadow-sm cursor-pointer">
<option disabled="" selected="" value="">انتخاب کنید...</option>
<option value="banner">بنر تمام صفحه (ورودی اپ)</option>
<option value="featured">آگهی ویژه (پین شده در بالا)</option>
<option value="carousel">اسلایدشو (صفحه اصلی)</option>
<option value="text">لینک متنی ساده</option>
</select>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">expand_more</span>
</div>
<p class="text-xs text-slate-500 dark:text-slate-500 mt-1.5 pr-1">تعرفه هر پکیج پس از ثبت درخواست برای شما ارسال می‌شود.</p>
</label>
<label class="flex flex-col w-full group">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 pr-1">توضیحات تکمیلی</span>
<textarea class="form-textarea w-full rounded-2xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark p-4 min-h-[120px] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-all shadow-sm focus:border-primary resize-none leading-relaxed" placeholder="اگر سوالی دارید یا نکته خاصی مد نظرتان است، اینجا بنویسید..."></textarea>
</label>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-4 pb-6 bg-white/90 dark:bg-background-dark/90 backdrop-blur-xl border-t border-border-light dark:border-border-dark z-20 shadow-[0_-8px_30px_rgba(0,0,0,0.04)]">
<button class="flex w-full cursor-pointer items-center justify-center rounded-2xl h-14 bg-primary hover:bg-primary-hover active:bg-primary-hover text-white text-lg font-bold tracking-wide transition-all shadow-glow active:scale-[0.98] transform">
<span class="ml-2">ارسال درخواست</span>
<span class="material-symbols-outlined text-[20px] rotate-180">send</span>
</button>
</div>
</div>

</body></html>
