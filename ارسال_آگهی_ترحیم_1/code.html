<!DOCTYPE html>
<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ارسال آگهی ترحیم</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6", // Updated to a slightly lighter blue for better dark mode contrast
                        "primary-hover": "#2563eb",
                        "background-base": "#111318", // Deep dark background
                        "surface": "#1c2029", // Slightly lighter for inputs/elements
                        "border-color": "#2d3342",
                        "text-muted": "#9ca3af",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Noto Sans Arabic", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #111318;
            color: white;
            min-height: 100vh;
        }::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111318;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3342;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-base font-display text-white antialiased selection:bg-primary/30 selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<div class="flex items-center justify-between bg-background-base p-4 pb-2 sticky top-0 z-30 border-b border-border-color">
<div class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-surface cursor-pointer text-white transition-colors">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12 text-white">ارسال آگهی ترحیم</h2>
</div>
<div class="flex-1 flex flex-col items-center pb-28">
<div class="w-full max-w-[480px] p-4 pt-6 flex flex-col items-center">
<div class="relative group cursor-pointer">
<div class="size-32 rounded-full bg-surface border-2 border-dashed border-border-color flex items-center justify-center overflow-hidden group-hover:border-primary transition-colors">
<span class="material-symbols-outlined text-text-muted text-4xl group-hover:text-primary transition-colors">add_a_photo</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary rounded-full p-2 border-4 border-background-base shadow-sm">
<span class="material-symbols-outlined text-white text-sm">edit</span>
</div>
</div>
<p class="mt-3 text-sm font-medium text-text-muted">تصویر مرحوم را بارگذاری کنید</p>
</div>
<div class="w-full max-w-[480px]">
<h2 class="text-white tracking-light text-[22px] font-bold leading-tight px-4 pb-3 pt-5">مشخصات متوفی</h2>
<div class="px-4 py-2">
<label class="flex flex-col flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">نام و نام خانوادگی</p>
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface h-14 placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white transition-all shadow-sm" placeholder="نام کامل مرحوم را وارد کنید"/>
</label>
</div>
<div class="flex flex-wrap items-end gap-4 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">تاریخ تولد</p>
<div class="relative">
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface h-14 placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white text-left pl-10 transition-all shadow-sm" placeholder="۱۴۰۰/۰۱/۰۱"/>
<span class="material-symbols-outlined absolute left-3 top-4 text-gray-500 pointer-events-none">calendar_month</span>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">تاریخ فوت</p>
<div class="relative">
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface h-14 placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white text-left pl-10 transition-all shadow-sm" placeholder="۱۴۰۲/۰۱/۰۱"/>
<span class="material-symbols-outlined absolute left-3 top-4 text-gray-500 pointer-events-none">event_busy</span>
</div>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">متن آگهی</p>
<textarea class="flex w-full min-w-0 flex-1 resize-none rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface min-h-[140px] placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white transition-all shadow-sm" placeholder="متن کامل اعلامیه، شعر یا پیام تسلیت خود را اینجا بنویسید..."></textarea>
</label>
</div>
</div>
<div class="w-full h-px bg-border-color my-6 max-w-[480px]"></div>
<div class="w-full max-w-[480px]">
<h2 class="text-white tracking-light text-[22px] font-bold leading-tight px-4 pb-3">اطلاعات تماس شما</h2>
<p class="px-4 text-sm text-text-muted mb-4 leading-relaxed">این اطلاعات صرفاً جهت احراز هویت است و در آگهی نمایش داده نمی‌شود.</p>
<div class="px-4 py-2">
<label class="flex flex-col flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">نام فرستنده</p>
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface h-14 placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white transition-all shadow-sm" placeholder="نام و نام خانوادگی شما"/>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col flex-1">
<p class="text-gray-300 text-base font-medium leading-normal pb-2">شماره همراه</p>
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-color bg-surface h-14 placeholder:text-gray-600 p-[15px] text-base font-normal leading-normal text-white text-left transition-all shadow-sm" placeholder="0912..." type="tel"/>
</label>
</div>
</div>
<div class="w-full max-w-[480px] px-4 mt-6">
<div class="flex gap-3 bg-blue-900/20 border border-blue-500/20 rounded-xl p-4 items-start">
<span class="material-symbols-outlined text-blue-400 shrink-0">info</span>
<p class="text-sm text-gray-300 leading-6">
                    آگهی شما پس از بررسی و تأیید توسط مدیریت در اپلیکیشن منتشر خواهد شد. این فرآیند ممکن است تا ۱ ساعت زمان ببرد.
                </p>
</div>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-base/80 backdrop-blur-xl border-t border-border-color z-20 flex justify-center">
<button class="w-full max-w-[480px] h-14 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl text-lg flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-900/20 active:scale-[0.98]">
<span>ثبت و ارسال آگهی</span>
<span class="material-symbols-outlined rtl:rotate-180">send</span>
</button>
</div>
</div>

</body></html>
